---
- name: Gather Linux Server Details and Generate HTML Report
  hosts: all
  gather_facts: true
  
  tasks:
    - name: Get last patch/update info (DNF, YUM, or APT)
      ansible.builtin.shell: |
        if command -v dnf &> /dev/null; then
          dnf history | head -n 3 | tail -n 1
        elif command -v yum &> /dev/null; then
          yum history | head -n 3 | tail -n 1
        elif command -v apt &> /dev/null; then
          grep "upgrade " /var/log/dpkg.log* 2>/dev/null | tail -n 1 || echo "No recent APT history found"
        else
          echo "Package manager not supported"
        fi
      register: patch_info
      changed_when: false
      ignore_errors: true

- name: Compile and Save Report on AAP Controller
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Ensure /tmp directory exists on controller
      ansible.builtin.file:
        path: /tmp
        state: directory
        mode: '0755'

    - name: Generate HTML Report file
      ansible.builtin.copy:
        dest: /tmp/linux_servers_report.html
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Linux Servers Health & Inventory Report</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
                  h2 { color: #004085; }
                  .timestamp { font-size: 14px; color: #666; margin-bottom: 20px; }
                  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; }
                  th, td { padding: 12px 15px; border: 1px solid #dee2e6; text-align: left; }
                  th { background-color: #007bff; color: white; text-transform: uppercase; font-size: 13px; }
                  tr:nth-child(even) { background-color: #f8f9fa; }
                  pre { margin: 0; font-family: inherit; font-size: 13px; white-space: pre-wrap; }
              </style>
          </head>
          <body>
              <h2>Linux Servers Inventory & Status Report</h2>
              <div class="timestamp">Generated by Ansible Automation Platform on: {{ ansible_date_time.date }} at {{ ansible_date_time.time }}</div>
              
              <table>
                  <thead>
                      <tr>
                          <th>Hostname</th>
                          <th>IP Address</th>
                          <th>OS Version</th>
                          <th>Kernel Version</th>
                          <th>Last Patch Detail</th>
                          <th>Uptime</th>
                      </tr>
                  </thead>
                  <tbody>
                      {% for host in groups['linux_servers'] %}
                      <tr>
                          <td><strong>{{ hostvars[host]['ansible_hostname'] | default('N/A') }}</strong></td>
                          <td>{{ hostvars[host]['ansible_default_ipv4']['address'] | default('N/A') }}</td>
                          <td>{{ hostvars[host]['ansible_distribution'] | default('N/A') }} {{ hostvars[host]['ansible_distribution_version'] | default('') }}</td>
                          <td>{{ hostvars[host]['ansible_kernel'] | default('N/A') }}</td>
                          <td><pre>{{ hostvars[host]['patch_info']['stdout'] | default('N/A') }}</pre></td>
                          <td>{{ (hostvars[host]['ansible_uptime_seconds'] | default(0) | int / 86400) | round(1) }} days</td>
                      </tr>
                      {% endfor %}
                  </tbody>
              </table>
          </body>
          </html>

    - name: Confirmation message
      ansible.builtin.debug:
        msg: "Success! HTML report is stored at /tmp/linux_servers_report.html"
