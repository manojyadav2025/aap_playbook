---
- name: Collect RHEL server information
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Get latest RPM installation information
      ansible.builtin.shell: "rpm -qa --last | head -n 1"
      register: latest_rpm
      changed_when: false
      failed_when: false

    - name: Check Telnet package installation
      ansible.builtin.command: rpm -q telnet
      register: telnet_check
      changed_when: false
      failed_when: false

    - name: Store server details
      ansible.builtin.set_fact:
        report_hostname: "{{ ansible_hostname | default(inventory_hostname) }}"
        report_ip: >-
          {{ ansible_default_ipv4.address
             | default(ansible_host | default('Not available')) }}
        report_kernel: "{{ ansible_kernel | default('Not available') }}"
        report_last_patch: >-
          {{ latest_rpm.stdout | default('Not available')
             if latest_rpm.rc | default(1) == 0
             else 'Not available' }}
        report_telnet: >-
          {{ 'Yes' if telnet_check.rc | default(1) == 0 else 'No' }}

- name: Generate, transfer and email HTML report
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    report_output: /tmp/rhel_server_report.html
    report_server: ansible.test.manoj.co.in
    report_remote_path: /tmp/rhel_server_report.html
    report_group: all
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_username: "{{ smtp_username }}"
    smtp_password: "{{ smtp_password }}"
    report_recipient: manoj_yadav@hotmail.com

  tasks:
    - name: Generate consolidated HTML report
      ansible.builtin.copy:
        dest: "{{ report_output }}"
        mode: "0600"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>RHEL Server Inventory and Patch Report</title>
          <style>
          body {
            font-family: Arial, sans-serif;
            margin: 25px;
            color: #222;
          }
          h2 { color: #8b0000; }
          table {
            border-collapse: collapse;
            width: 100%;
          }
          th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
          }
          th {
            background: #8b0000;
            color: white;
          }
          tr:nth-child(even) { background: #f2f2f2; }
          </style>
          </head>
          <body>
          <h2>RHEL Server Inventory and Patch Report</h2>
          <p>Generated: {{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }} UTC</p>
          <p>Total servers: {{ groups[report_group] | default([]) | length }}</p>
          <table>
          <thead>
          <tr>
          <th>Hostname</th>
          <th>IP Address</th>
          <th>Kernel Version</th>
          <th>Last Patch Date</th>
          <th>Telnet Package Installed</th>
          </tr>
          </thead>
          <tbody>
          {% for host in groups[report_group] | default([]) | sort %}
          {% set d = hostvars[host] %}
          <tr>
          <td>{{ d.report_hostname | default(host) | e }}</td>
          <td>{{ d.report_ip | default('Not available') | e }}</td>
          <td>{{ d.report_kernel | default('Not available') | e }}</td>
          <td>{{ d.report_last_patch | default('Not available') | e }}</td>
          <td>{{ d.report_telnet | default('No') | e }}</td>
          </tr>
          {% else %}
          <tr><td colspan="5">No servers found.</td></tr>
          {% endfor %}
          </tbody>
          </table>
          <p><small>
          Note: Last Patch Date represents the latest RPM installation
          information and is not necessarily the last security patch date.
          </small></p>
          </body>
          </html>

    - name: Copy report to ansible.test.manoj.co.in using SCP
      ansible.builtin.command:
        argv:
          - scp
          - -o
          - BatchMode=yes
          - "{{ report_output }}"
          - "{{ report_server }}:{{ report_remote_path }}"
      changed_when: true

    - name: Email report to Hotmail using Gmail SMTP
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        secure: starttls
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ report_recipient }}"
        from: "{{ smtp_username }}"
        subject: "RHEL Server Inventory and Patch Report"
        subtype: plain
        body: |
          Hello,

          Please find attached the consolidated RHEL server inventory
          and patch report.

          The report is also available on:
          {{ report_server }}:{{ report_remote_path }}

          Regards,
          Ansible Automation Platform
        attach:
          - "{{ report_output }}"
      no_log: true

    - name: Confirm report generation and delivery tasks
      ansible.builtin.debug:
        msg:
          - "HTML report generated: {{ report_output }}"
          - "Report transfer destination: {{ report_server }}:{{ report_remote_path }}"
          - "Email delivery task completed for {{ report_recipient }}"
