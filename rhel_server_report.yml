---
- name: Collect RHEL server information
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Get latest RPM installation information
      ansible.builtin.shell: "rpm -qa --last | head -n 1"
      register: latest_rpm
      changed_when: false
      failed_when: false

    - name: Check Telnet package installation
      ansible.builtin.command: rpm -q telnet
      register: telnet_check
      changed_when: false
      failed_when: false

    - name: Store server details
      ansible.builtin.set_fact:
        report_hostname: "{{ ansible_hostname | default(inventory_hostname) }}"
        report_ip: >-
          {{ ansible_default_ipv4.address
             | default(ansible_host | default('Not available')) }}
        report_kernel: "{{ ansible_kernel | default('Not available') }}"
        report_last_patch: >-
          {{ latest_rpm.stdout | default('Not available')
             if latest_rpm.rc | default(1) == 0
             else 'Not available' }}
        report_telnet: >-
          {{ 'Yes' if telnet_check.rc | default(1) == 0 else 'No' }}
        report_disks: "{{ ansible_devices | default({}) }}"

- name: Generate and email consolidated HTML report
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    report_group: all
    report_recipient: manoj_yadav@hotmail.com
    smtp_host: smtp.gmail.com
    smtp_port: 587

  tasks:
    - name: Email consolidated HTML report
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        secure: starttls
        username: "{{ smtp_username }}"
        password: "{{ smtp_password }}"
        to: "{{ report_recipient }}"
        from: "{{ smtp_username }}"
        subject: "RHEL Server Inventory, Patch and Disk Report"
        subtype: html
        body: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>RHEL Server Report</title>
          <style>
          body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
          }
          h2 { color: #8b0000; }
          table {
            border-collapse: collapse;
            width: 100%;
          }
          th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
          }
          th {
            background-color: #8b0000;
            color: white;
          }
          tr:nth-child(even) { background-color: #f2f2f2; }
          </style>
          </head>
          <body>
          <h2>RHEL Server Inventory and Patch Report</h2>

          <p>
          Generated: {{ now(utc=true, fmt='%Y-%m-%d %H:%M:%S') }} UTC
          </p>
          <p>
          Total servers: {{ groups[report_group] | default([]) | length }}
          </p>

          <table>
          <thead>
          <tr>
          <th>Hostname</th>
          <th>IP Address</th>
          <th>Kernel Version</th>
          <th>Last Patch Date</th>
          <th>Telnet Package Installed</th>
          <th>Disk Name / Size</th>
          </tr>
          </thead>
          <tbody>
          {% for host in groups[report_group] | default([]) | sort %}
          {% set d = hostvars[host] %}
          <tr>
          <td>{{ d.report_hostname | default(host) | e }}</td>
          <td>{{ d.report_ip | default('Not available') | e }}</td>
          <td>{{ d.report_kernel | default('Not available') | e }}</td>
          <td>{{ d.report_last_patch | default('Not available') | e }}</td>
          <td>{{ d.report_telnet | default('Not available') | e }}</td>
          <td>
          {% set disks = d.report_disks | default({}) %}
          {% if disks %}
            {% for disk_name, disk_data in disks.items() | sort %}
              {{ disk_name | e }}:
              {{ disk_data.size | default('Size unavailable') | e }}<br>
            {% endfor %}
          {% else %}
            Disk information unavailable
          {% endif %}
          </td>
          </tr>
          {% else %}
          <tr><td colspan="6">No servers found.</td></tr>
          {% endfor %}
          </tbody>
          </table>

          <p>
          <small>
          Note: Last Patch Date represents the latest RPM installation
          information and is not necessarily the last security patch date.
          Disk sizes are reported from Ansible hardware facts.
          </small>
          </p>
          </body>
          </html>
      no_log: true

    - name: Confirm email task completion
      ansible.builtin.debug:
        msg: "HTML report email task completed for {{ report_recipient }}"
